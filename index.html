<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniPop</title>
  <meta name="description" content="MiniPop is a next-gen audio hosting platform.">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: #bbe27c;
      color: #1f4a12;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      text-align: center;
    }
    .logo {
      width: min(70vmin, 560px);
      height: auto;
      display: block;
    }
    .tagline {
      margin: 0;
      max-width: 32em;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.svg" alt="MiniPop logo">
    <p class="tagline">The next-gen audio hosting</p>
  </main>
</body>
</html>
