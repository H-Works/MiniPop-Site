<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniPop</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: #bbe27c;
    }
    .logo {
      width: min(80vmin, 640px);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.svg" alt="MiniPop logo">
</body>
</html>
